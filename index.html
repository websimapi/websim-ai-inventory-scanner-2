<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Inventory Scanner</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Import Map for Modules -->
    <script type="importmap">
    {
        "imports": {
            "@tensorflow/tfjs": "https://esm.sh/@tensorflow/tfjs@4.10.0",
            "@tensorflow-models/coco-ssd": "https://esm.sh/@tensorflow-models/coco-ssd@2.2.3"
        }
    }
    </script>
</head>
<body>

    <div id="app">
        <!-- Camera View -->
        <div id="camera-container">
            <video id="camera-feed" playsinline autoplay muted></video>
            <canvas id="capture-canvas"></canvas>
            <div id="scan-overlay">
                <div class="scanner-reticle"></div>
            </div>
        </div>

        <!-- Loading Screen -->
        <div id="loading-screen">
            <div class="spinner"></div>
            <p>Initializing Neural Network...</p>
        </div>

        <!-- Main UI Overlay -->
        <div id="ui-layer">
            <!-- Header with Status -->
            <div class="header">
                <div class="status-badge" id="ai-status">Loading Model...</div>
                <button id="toggle-inventory-btn" class="icon-btn">
                    📦 <span id="item-count-badge">0</span>
                </button>
            </div>

            <!-- Bottom Controls -->
            <div class="controls">
                <button id="scan-btn" class="primary-btn" disabled>
                    SCAN ITEM
                </button>
            </div>
        </div>

        <!-- Result Modal -->
        <div id="result-modal" class="modal hidden">
            <div class="modal-content">
                <h3>Object Detected</h3>
                <div class="detected-image-container">
                    <img id="detected-snapshot" src="" alt="Snapshot">
                </div>
                <div class="prediction-list" id="prediction-list">
                    <!-- Predictions go here -->
                </div>
                <div class="input-group">
                    <label>Confirm Name</label>
                    <input type="text" id="item-name-input" placeholder="Item Name">
                </div>
                <div class="modal-actions">
                    <button id="discard-btn" class="secondary-btn">Discard</button>
                    <button id="save-btn" class="primary-btn">Save to Inventory</button>
                </div>
            </div>
        </div>

        <!-- Inventory Drawer -->
        <div id="inventory-drawer" class="drawer hidden">
            <div class="drawer-header">
                <h2>Inventory</h2>
                <button id="close-inventory-btn" class="text-btn">Close</button>
            </div>
            <div id="inventory-list" class="inventory-list">
                <!-- Items go here -->
                <div class="empty-state">No items scanned yet.</div>
            </div>
            <div class="drawer-footer">
                <button id="export-btn" class="secondary-btn">Export JSON</button>
                <button id="clear-btn" class="danger-btn">Clear All</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
